# =============================================================================
# OPTIONAL infrastructure. The prototype does NOT need any of this.
# =============================================================================
# By default the application runs with:
#   * Qdrant embedded in-process  (./data/qdrant)
#   * SQLite                      (./data/gardencity.db)
#
# Both are real, both are free, and neither needs Docker. Use this file only
# when you want server-mode Qdrant (so ingestion and the API can run at the
# same time) or PostgreSQL (closer to a production topology).
#
#   docker compose -f docker/docker-compose.yml up -d qdrant
#   docker compose -f docker/docker-compose.yml up -d postgres
#
# Then set the matching values in .env — see the comments on each service.
# =============================================================================

name: garden-city-ai

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: gc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
    healthcheck:
      # The Qdrant image is distroless and has neither curl nor wget, so probe
      # the port with bash's /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # .env:  QDRANT_URL=http://localhost:6333
    #        (then re-run ./scripts/ingest.sh to populate the server)

  postgres:
    image: postgres:17-alpine
    container_name: gc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gc
      POSTGRES_PASSWORD: gc_local_dev_only
      POSTGRES_DB: gardencity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gc -d gardencity"]
      interval: 10s
      timeout: 5s
      retries: 5
    # .env:  DATABASE_URL=postgresql+asyncpg://gc:gc_local_dev_only@localhost:5432/gardencity
    #        and:  ./backend/.venv/bin/pip install asyncpg
    #
    # The password above is a throwaway for local development. Never reuse it
    # anywhere real — see SECURITY_ROADMAP.md on secrets management.

volumes:
  qdrant_data:
  postgres_data:
